<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion BDD - Launcher</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>

    <style>
        :root {
            --mh-corail-brand: #E2250C;
            --mh-bleu-dark: #1A283E;
            --mh-corail-pastel: #FFF2F0;
            --mh-gris-sable-pastel: #F9F7F6;
            --mh-bleu-pastel: #E0F1F8;
            --mh-gris-sable-dark: #E4D8C4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, var(--mh-corail-pastel) 0%, var(--mh-gris-sable-pastel) 50%, var(--mh-bleu-pastel) 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            text-align: center;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: var(--mh-corail-brand);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            box-shadow: 0 8px 24px rgba(226, 37, 12, 0.3);
        }

        .logo svg {
            width: 50px;
            height: 50px;
            fill: white;
        }

        h1 {
            font-size: 22px;
            font-weight: 600;
            color: var(--mh-bleu-dark);
            margin-bottom: 8px;
        }

        p {
            font-size: 13px;
            color: #666;
            margin-bottom: 30px;
        }

        .btn-launch {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 16px 32px;
            background: var(--mh-corail-brand);
            color: white;
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 16px rgba(226, 37, 12, 0.3);
        }

        .btn-launch:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(226, 37, 12, 0.4);
        }

        .btn-launch:active {
            transform: translateY(0);
        }

        .btn-launch svg {
            width: 20px;
            height: 20px;
        }

        .status {
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }

        .status.connected {
            color: #008275;
        }

        .info {
            margin-top: 40px;
            padding: 15px;
            background: white;
            border-radius: 10px;
            border: 1px solid var(--mh-gris-sable-dark);
            font-size: 12px;
            color: #666;
            max-width: 280px;
        }

        .info strong {
            color: var(--mh-bleu-dark);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <svg viewBox="0 0 24 24">
                <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14H6v-2h6v2zm4-4H6v-2h10v2zm0-4H6V7h10v2z"/>
            </svg>
        </div>

        <h1>Gestion BDD</h1>
        <p>Contacts, Projets & Liaisons</p>

        <button class="btn-launch" onclick="openDialog()">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M19 19H5V5h7V3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/>
            </svg>
            Ouvrir l'application
        </button>

        <div class="status" id="status">Pret</div>

        <div class="info">
            <strong>Astuce :</strong> L'application s'ouvre dans une fenetre separee pour plus d'espace de travail.
        </div>
    </div>

    <script>
        const CONFIG = {
            sheetName: 'Feuil1',
            configSheetName: 'mdp',
            passwordCell: 'B2',
            contacts: { col: 'A', startRow: 2 },
            projets: { col: 'C', startRow: 2 },
            liaisons: { colContact: 'E', colProjet: 'F', startRow: 2 }
        };

        let dialog = null;
        let data = { contacts: [], projets: [], liaisons: [] };

        Office.onReady((info) => {
            if (info.host === Office.HostType.Excel) {
                document.getElementById('status').textContent = 'Connecte a Excel';
                document.getElementById('status').classList.add('connected');
            }
        });

        function getDataSheet(context) {
            return context.workbook.worksheets.getItem(CONFIG.sheetName);
        }

        function openDialog() {
            const dialogUrl = window.location.href.replace('taskpane.html', 'dialog.html').split('?')[0];

            Office.context.ui.displayDialogAsync(
                dialogUrl,
                { height: 80, width: 80 },
                (result) => {
                    if (result.status === Office.AsyncResultStatus.Succeeded) {
                        dialog = result.value;
                        dialog.addEventHandler(Office.EventType.DialogMessageReceived, handleDialogMessage);
                        dialog.addEventHandler(Office.EventType.DialogEventReceived, handleDialogEvent);
                        document.getElementById('status').textContent = 'Application ouverte';

                        // Load data initially
                        setTimeout(() => loadAndSendData(), 500);
                    } else {
                        console.error('Dialog failed:', result.error);
                        document.getElementById('status').textContent = 'Erreur ouverture';
                    }
                }
            );
        }

        function handleDialogEvent(arg) {
            if (arg.error === 12006) {
                // Dialog closed
                dialog = null;
                document.getElementById('status').textContent = 'Pret';
            }
        }

        async function handleDialogMessage(arg) {
            try {
                const message = JSON.parse(arg.message);
                console.log('Received message:', message);

                switch (message.action) {
                    case 'close':
                        if (dialog) dialog.close();
                        dialog = null;
                        document.getElementById('status').textContent = 'Pret';
                        break;

                    case 'loadData':
                        await loadAndSendData();
                        break;

                    case 'addContact':
                        await addContact(message.name);
                        await loadAndSendData();
                        break;

                    case 'updateContact':
                        await updateContact(message.index, message.name);
                        await loadAndSendData();
                        break;

                    case 'deleteContact':
                        await deleteItem('contact', message.index);
                        await loadAndSendData();
                        break;

                    case 'addProjet':
                        await addProjet(message.name);
                        await loadAndSendData();
                        break;

                    case 'updateProjet':
                        await updateProjet(message.index, message.name);
                        await loadAndSendData();
                        break;

                    case 'deleteProjet':
                        await deleteItem('projet', message.index);
                        await loadAndSendData();
                        break;

                    case 'addLiaison':
                        await addLiaison(message.contact, message.projet);
                        await loadAndSendData();
                        break;

                    case 'updateLiaison':
                        await updateLiaison(message.index, message.contact, message.projet);
                        await loadAndSendData();
                        break;

                    case 'deleteLiaison':
                        await deleteItem('liaison', message.index);
                        await loadAndSendData();
                        break;

                    case 'getProtectionStatus':
                        await sendProtectionStatus();
                        break;

                    case 'protectWorkbook':
                        await protectWorkbook();
                        break;

                    case 'unprotectWorkbook':
                        await unprotectWorkbook(message.password);
                        break;
                }
            } catch (error) {
                console.error('Error handling message:', error);
            }
        }

        async function loadAndSendData() {
            try {
                await Excel.run(async (context) => {
                    const sheet = getDataSheet(context);

                    const contactsRange = sheet.getRange('A:A').getUsedRange();
                    contactsRange.load('values');

                    const projetsRange = sheet.getRange('C:C').getUsedRange();
                    projetsRange.load('values');

                    const liaisonsRange = sheet.getRange('E:F').getUsedRange();
                    liaisonsRange.load('values');

                    await context.sync();

                    // Process contacts
                    data.contacts = [];
                    if (contactsRange.values) {
                        for (let i = 1; i < contactsRange.values.length; i++) {
                            const val = contactsRange.values[i][0];
                            if (val && val.toString().trim()) {
                                data.contacts.push(val.toString().trim());
                            }
                        }
                    }

                    // Process projets
                    data.projets = [];
                    if (projetsRange.values) {
                        for (let i = 1; i < projetsRange.values.length; i++) {
                            const val = projetsRange.values[i][0];
                            if (val && val.toString().trim()) {
                                data.projets.push(val.toString().trim());
                            }
                        }
                    }

                    // Process liaisons
                    data.liaisons = [];
                    if (liaisonsRange.values) {
                        for (let i = 1; i < liaisonsRange.values.length; i++) {
                            const contact = liaisonsRange.values[i][0];
                            const projet = liaisonsRange.values[i][1];
                            if (contact && projet) {
                                data.liaisons.push({
                                    contact: contact.toString().trim(),
                                    projet: projet.toString().trim()
                                });
                            }
                        }
                    }
                });

                // Send data to dialog
                if (dialog) {
                    dialog.messageChild(JSON.stringify({ action: 'receiveData', data }));
                }
            } catch (error) {
                console.error('Error loading data:', error);
            }
        }

        async function addContact(name) {
            await Excel.run(async (context) => {
                const sheet = getDataSheet(context);
                const newRow = data.contacts.length + 2;
                sheet.getRange(`A${newRow}`).values = [[name]];
                await context.sync();
            });
        }

        async function updateContact(index, name) {
            await Excel.run(async (context) => {
                const sheet = getDataSheet(context);
                const row = index + 2;
                sheet.getRange(`A${row}`).values = [[name]];
                await context.sync();
            });
        }

        async function addProjet(name) {
            await Excel.run(async (context) => {
                const sheet = getDataSheet(context);
                const newRow = data.projets.length + 2;
                sheet.getRange(`C${newRow}`).values = [[name]];
                await context.sync();
            });
        }

        async function updateProjet(index, name) {
            await Excel.run(async (context) => {
                const sheet = getDataSheet(context);
                const row = index + 2;
                sheet.getRange(`C${row}`).values = [[name]];
                await context.sync();
            });
        }

        async function addLiaison(contact, projet) {
            await Excel.run(async (context) => {
                const sheet = getDataSheet(context);
                const newRow = data.liaisons.length + 2;
                sheet.getRange(`E${newRow}:F${newRow}`).values = [[contact, projet]];
                await context.sync();
            });
        }

        async function updateLiaison(index, contact, projet) {
            await Excel.run(async (context) => {
                const sheet = getDataSheet(context);
                const row = index + 2;
                sheet.getRange(`E${row}:F${row}`).values = [[contact, projet]];
                await context.sync();
            });
        }

        async function deleteItem(type, index) {
            await Excel.run(async (context) => {
                const sheet = getDataSheet(context);
                const row = index + 2;

                if (type === 'contact') {
                    sheet.getRange(`A${row}`).delete(Excel.DeleteShiftDirection.up);
                } else if (type === 'projet') {
                    sheet.getRange(`C${row}`).delete(Excel.DeleteShiftDirection.up);
                } else if (type === 'liaison') {
                    sheet.getRange(`E${row}:F${row}`).delete(Excel.DeleteShiftDirection.up);
                }

                await context.sync();
            });
        }

        // Protection functions
        async function getStoredPassword() {
            let password = null;
            await Excel.run(async (context) => {
                try {
                    const configSheet = context.workbook.worksheets.getItem(CONFIG.configSheetName);
                    const passwordRange = configSheet.getRange(CONFIG.passwordCell);
                    passwordRange.load('values');
                    await context.sync();
                    if (passwordRange.values && passwordRange.values[0][0]) {
                        password = passwordRange.values[0][0].toString();
                    }
                } catch (e) {
                    console.log('Config sheet not found or error:', e);
                }
            });
            return password;
        }

        async function sendProtectionStatus() {
            try {
                await Excel.run(async (context) => {
                    const workbook = context.workbook;
                    workbook.load('protection/protected');
                    await context.sync();

                    const isProtected = workbook.protection.protected;
                    if (dialog) {
                        dialog.messageChild(JSON.stringify({
                            action: 'protectionStatus',
                            isProtected: isProtected
                        }));
                    }
                });
            } catch (error) {
                console.error('Error getting protection status:', error);
            }
        }

        async function protectWorkbook() {
            try {
                const storedPassword = await getStoredPassword();
                if (!storedPassword) {
                    if (dialog) {
                        dialog.messageChild(JSON.stringify({
                            action: 'protectionResult',
                            success: false,
                            message: 'Mot de passe non configure dans la feuille _Config'
                        }));
                    }
                    return;
                }

                await Excel.run(async (context) => {
                    const workbook = context.workbook;
                    workbook.protection.protect(storedPassword);
                    await context.sync();

                    if (dialog) {
                        dialog.messageChild(JSON.stringify({
                            action: 'protectionResult',
                            success: true,
                            message: 'Classeur protege',
                            isProtected: true
                        }));
                    }
                });
            } catch (error) {
                console.error('Error protecting workbook:', error);
                if (dialog) {
                    dialog.messageChild(JSON.stringify({
                        action: 'protectionResult',
                        success: false,
                        message: 'Erreur: ' + error.message
                    }));
                }
            }
        }

        async function unprotectWorkbook(userPassword) {
            try {
                const storedPassword = await getStoredPassword();
                if (!storedPassword) {
                    if (dialog) {
                        dialog.messageChild(JSON.stringify({
                            action: 'protectionResult',
                            success: false,
                            message: 'Mot de passe non configure'
                        }));
                    }
                    return;
                }

                if (userPassword !== storedPassword) {
                    if (dialog) {
                        dialog.messageChild(JSON.stringify({
                            action: 'protectionResult',
                            success: false,
                            message: 'Mot de passe incorrect'
                        }));
                    }
                    return;
                }

                await Excel.run(async (context) => {
                    const workbook = context.workbook;
                    workbook.protection.unprotect(storedPassword);
                    await context.sync();

                    if (dialog) {
                        dialog.messageChild(JSON.stringify({
                            action: 'protectionResult',
                            success: true,
                            message: 'Classeur deprotege',
                            isProtected: false
                        }));
                    }
                });
            } catch (error) {
                console.error('Error unprotecting workbook:', error);
                if (dialog) {
                    dialog.messageChild(JSON.stringify({
                        action: 'protectionResult',
                        success: false,
                        message: 'Erreur: ' + error.message
                    }));
                }
            }
        }
    </script>
</body>
</html>
