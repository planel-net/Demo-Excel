<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion BDD</title>

    <!-- Google Fonts - Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Office.js -->
    <script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>

    <style>
        /* Variables Malakoff Humanis */
        :root {
            /* Gamme Intense */
            --mh-corail-brand: #E2250C;
            --mh-bleu-dark: #1A283E;
            --mh-violet-dark: #5514C7;
            --mh-bleu-turquoise-dark: #006374;
            --mh-rose-dark: #D81E88;
            --mh-jaune-dark: #F9BD00;
            --mh-vert-dark: #008275;
            --mh-gris-sable-dark: #E4D8C4;
            --mh-rose-chair-light: #F0B7A5;
            --mh-gris-sable-light: #EDE8E6;

            /* Gamme Douce */
            --mh-corail-light: #F9D3CE;
            --mh-bleu-light: #BDE3F2;
            --mh-violet-light: #AA89E3;
            --mh-vert-light: #03DFB2;
            --mh-jaune-light: #F4EC5B;
            --mh-gris-sable-light-60: #F4F0EF;

            /* Gamme Pastel */
            --mh-corail-pastel: #FFF2F0;
            --mh-bleu-pastel: #E0F1F8;
            --mh-gris-sable-pastel: #F9F7F6;

            /* Sémantiques */
            --cadrage-surface: #ffffff;
            --cadrage-text: var(--mh-bleu-dark);
            --cadrage-text-secondary: #666666;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 13px;
            background: linear-gradient(135deg, var(--mh-corail-pastel) 0%, var(--mh-gris-sable-pastel) 50%, var(--mh-bleu-pastel) 100%);
            color: var(--cadrage-text);
            min-height: 100vh;
        }

        .container {
            padding: 15px;
        }

        header {
            background: var(--mh-corail-brand);
            color: white;
            padding: 15px;
            margin: -15px -15px 15px -15px;
            box-shadow: 0 2px 8px rgba(226, 37, 12, 0.3);
        }

        header h1 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        header p {
            font-size: 11px;
            opacity: 0.9;
        }

        /* Stats Cards */
        .stats {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat-card {
            flex: 1;
            background: var(--cadrage-surface);
            padding: 12px 8px;
            border-radius: 0.75rem;
            text-align: center;
            border: 1px solid var(--mh-gris-sable-dark);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .stat-value {
            font-size: 22px;
            font-weight: 700;
            color: var(--mh-corail-brand);
        }

        .stat-label {
            font-size: 10px;
            color: var(--cadrage-text-secondary);
            margin-top: 2px;
            font-weight: 500;
        }

        /* Refresh Bar */
        .refresh-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }

        /* Buttons */
        .btn {
            padding: 8px 14px;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            font-family: inherit;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: var(--mh-bleu-dark);
            color: white;
        }

        .btn-primary:hover {
            background: #0f1829;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(26, 40, 62, 0.3);
        }

        .btn-success {
            background: var(--mh-vert-dark);
            color: white;
        }

        .btn-success:hover {
            background: #006960;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 130, 117, 0.3);
        }

        .btn-danger {
            background: var(--mh-rose-dark);
            color: white;
        }

        .btn-danger:hover {
            background: #c01a75;
            transform: translateY(-1px);
        }

        .btn-warning {
            background: var(--mh-jaune-dark);
            color: var(--mh-bleu-dark);
        }

        .btn-warning:hover {
            background: #e0aa00;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--cadrage-surface);
            color: var(--mh-bleu-dark);
            border: 2px solid var(--mh-bleu-dark);
        }

        .btn-secondary:hover {
            background: var(--mh-bleu-dark);
            color: white;
        }

        .btn-sm {
            padding: 6px 10px;
            font-size: 11px;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 15px;
        }

        .tab {
            padding: 10px 16px;
            background: var(--cadrage-surface);
            border: 1px solid var(--mh-gris-sable-dark);
            border-radius: 0.5rem 0.5rem 0 0;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            font-family: inherit;
            transition: all 0.2s ease;
            color: var(--cadrage-text-secondary);
        }

        .tab.active {
            background: var(--mh-corail-brand);
            color: white;
            border-color: var(--mh-corail-brand);
        }

        .tab:hover:not(.active) {
            background: var(--mh-corail-pastel);
            border-color: var(--mh-corail-brand);
            color: var(--mh-corail-brand);
        }

        /* Tab Content */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Sections */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .section-header h2 {
            font-size: 14px;
            color: var(--mh-bleu-dark);
            font-weight: 600;
        }

        /* List Container */
        .list-container {
            background: var(--cadrage-surface);
            border-radius: 0.75rem;
            border: 1px solid var(--mh-gris-sable-dark);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            max-height: 300px;
            overflow-y: auto;
        }

        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            border-bottom: 1px solid var(--mh-gris-sable-light);
            transition: background 0.2s ease;
        }

        .list-item:last-child {
            border-bottom: none;
        }

        .list-item:hover {
            background: var(--mh-gris-sable-light-60);
        }

        .list-item-content {
            flex: 1;
        }

        .list-item-title {
            font-weight: 600;
            color: var(--mh-bleu-dark);
        }

        .list-item-subtitle {
            font-size: 11px;
            color: var(--cadrage-text-secondary);
            margin-top: 3px;
        }

        .list-item-actions {
            display: flex;
            gap: 6px;
        }

        /* Badges */
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 2rem;
            font-size: 10px;
            font-weight: 500;
        }

        .badge-contact {
            background: var(--mh-bleu-light);
            color: var(--mh-bleu-turquoise-dark);
        }

        .badge-projet {
            background: var(--mh-vert-light);
            color: var(--mh-vert-dark);
        }

        /* Empty State */
        .empty-state {
            padding: 40px 20px;
            text-align: center;
            color: var(--cadrage-text-secondary);
        }

        /* Loading */
        .loading {
            display: flex;
            justify-content: center;
            padding: 30px;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid var(--mh-gris-sable-dark);
            border-top-color: var(--mh-corail-brand);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(226, 37, 12, 0.3);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--cadrage-surface);
            border-radius: 1rem;
            width: 90%;
            max-width: 350px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(226, 37, 12, 0.2);
        }

        .modal-header {
            padding: 15px;
            border-bottom: 1px solid var(--mh-gris-sable-dark);
            background: var(--mh-corail-pastel);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 1rem 1rem 0 0;
        }

        .modal-header h3 {
            font-size: 14px;
            font-weight: 600;
            color: var(--mh-bleu-dark);
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: var(--cadrage-text-secondary);
            transition: color 0.2s;
        }

        .modal-close:hover {
            color: var(--mh-corail-brand);
        }

        .modal-body {
            padding: 15px;
        }

        .modal-footer {
            padding: 12px 15px;
            border-top: 1px solid var(--mh-gris-sable-dark);
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            background: var(--mh-gris-sable-pastel);
            border-radius: 0 0 1rem 1rem;
        }

        /* Forms */
        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 12px;
            color: var(--mh-bleu-dark);
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            background: var(--mh-gris-sable-pastel);
            border: 1px solid var(--mh-gris-sable-dark);
            border-radius: 0.5rem;
            font-size: 13px;
            font-family: inherit;
            color: var(--cadrage-text);
            transition: all 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--mh-corail-brand);
            box-shadow: 0 0 0 3px rgba(226, 37, 12, 0.15);
            background: white;
        }

        .form-group input::placeholder {
            color: #999999;
        }

        /* Alerts */
        .alert {
            padding: 12px 14px;
            border-radius: 0.5rem;
            margin-bottom: 15px;
            font-size: 12px;
            font-weight: 500;
            animation: fadeIn 0.3s ease;
        }

        .alert-success {
            background: var(--mh-vert-light);
            border: 1px solid var(--mh-vert-dark);
            color: var(--mh-vert-dark);
        }

        .alert-error {
            background: var(--mh-corail-light);
            border: 1px solid var(--mh-corail-brand);
            color: var(--mh-corail-brand);
        }

        .alert-info {
            background: var(--mh-bleu-light);
            border: 1px solid var(--mh-bleu-turquoise-dark);
            color: var(--mh-bleu-turquoise-dark);
        }

        /* Chart Container */
        .chart-container {
            background: var(--cadrage-surface);
            border-radius: 0.75rem;
            border: 1px solid var(--mh-gris-sable-dark);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            margin-bottom: 15px;
            overflow: hidden;
        }

        .chart-header {
            padding: 12px 15px;
            background: var(--mh-corail-pastel);
            border-bottom: 1px solid var(--mh-gris-sable-dark);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chart-header h3 {
            font-size: 14px;
            font-weight: 600;
            color: var(--mh-bleu-dark);
            margin: 0;
        }

        .chart-body {
            padding: 20px;
        }

        .bar-chart {
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            height: 150px;
            padding-top: 20px;
        }

        .bar-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            max-width: 80px;
        }

        .bar {
            width: 50px;
            border-radius: 6px 6px 0 0;
            transition: height 0.5s ease;
            position: relative;
        }

        .bar-value {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-weight: 700;
            font-size: 14px;
            color: var(--mh-bleu-dark);
        }

        .bar-label {
            margin-top: 10px;
            font-size: 11px;
            font-weight: 500;
            color: var(--cadrage-text-secondary);
        }

        .bar-contacts {
            background: linear-gradient(180deg, var(--mh-bleu-light) 0%, var(--mh-bleu-turquoise-dark) 100%);
        }

        .bar-projets {
            background: linear-gradient(180deg, var(--mh-vert-light) 0%, var(--mh-vert-dark) 100%);
        }

        .bar-liaisons {
            background: linear-gradient(180deg, var(--mh-violet-light) 0%, var(--mh-violet-dark) 100%);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Gestion BDD</h1>
            <p>Contacts, Projets & Liaisons</p>
        </header>

        <div id="alertContainer"></div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="statContacts">-</div>
                <div class="stat-label">Contacts</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statProjets">-</div>
                <div class="stat-label">Projets</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statLiaisons">-</div>
                <div class="stat-label">Liaisons</div>
            </div>
        </div>

        <div class="refresh-bar">
            <button class="btn btn-secondary btn-sm" onclick="toggleChart()" style="margin-right: 8px;">
                <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M4 11H2v3h2v-3zm5-4H7v7h2V7zm5-5h-2v12h2V2zm-2-1a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1h-2zM6 7a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V7zm-5 4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1v-3z"/>
                </svg>
                Graphique
            </button>
            <button class="btn btn-primary btn-sm" onclick="loadAllData()">
                <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2v1z"/>
                    <path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466z"/>
                </svg>
                Rafraichir
            </button>
        </div>

        <!-- Chart Container -->
        <div id="chartContainer" class="chart-container" style="display: none;">
            <div class="chart-header">
                <h3>Statistiques</h3>
                <button class="modal-close" onclick="toggleChart()">&times;</button>
            </div>
            <div class="chart-body">
                <div class="bar-chart" id="barChart"></div>
            </div>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="showTab('contacts')">Contacts</button>
            <button class="tab" onclick="showTab('projets')">Projets</button>
            <button class="tab" onclick="showTab('liaisons')">Liaisons</button>
        </div>

        <!-- Tab Contacts -->
        <div id="tab-contacts" class="tab-content active">
            <div class="section-header">
                <h2>Liste des Contacts</h2>
                <button class="btn btn-success btn-sm" onclick="openModal('contact')">+ Ajouter</button>
            </div>
            <div class="list-container" id="contactsList">
                <div class="loading"><div class="spinner"></div></div>
            </div>
        </div>

        <!-- Tab Projets -->
        <div id="tab-projets" class="tab-content">
            <div class="section-header">
                <h2>Liste des Projets</h2>
                <button class="btn btn-success btn-sm" onclick="openModal('projet')">+ Ajouter</button>
            </div>
            <div class="list-container" id="projetsList">
                <div class="loading"><div class="spinner"></div></div>
            </div>
        </div>

        <!-- Tab Liaisons -->
        <div id="tab-liaisons" class="tab-content">
            <div class="section-header">
                <h2>Liaisons Contact-Projet</h2>
                <button class="btn btn-success btn-sm" onclick="openModal('liaison')">+ Ajouter</button>
            </div>
            <div class="list-container" id="liaisonsList">
                <div class="loading"><div class="spinner"></div></div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Formulaire</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="crudForm">
                    <div id="formFields"></div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal()">Annuler</button>
                <button class="btn btn-primary" onclick="saveItem()">Enregistrer</button>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal-overlay" id="deleteModalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h3>Confirmer la suppression</h3>
                <button class="modal-close" onclick="closeDeleteModal()">&times;</button>
            </div>
            <div class="modal-body">
                <p>Voulez-vous vraiment supprimer cet element ?</p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeDeleteModal()">Annuler</button>
                <button class="btn btn-danger" onclick="confirmDelete()">Supprimer</button>
            </div>
        </div>
    </div>

    <script>
        // Configuration des colonnes Excel
        const CONFIG = {
            sheetName: 'Feuil1', // Nom de la feuille de donnees (peut etre masquee)
            contacts: { col: 'A', startRow: 2, headerRow: 1 },
            projets: { col: 'C', startRow: 2, headerRow: 1 },
            liaisons: {
                colContact: 'E',
                colProjet: 'F',
                startRow: 2,
                headerRow: 1
            }
        };

        // Fonction pour obtenir la feuille de donnees (meme si masquee)
        function getDataSheet(context) {
            return context.workbook.worksheets.getItem(CONFIG.sheetName);
        }

        // Donnees
        let data = {
            contacts: [],
            projets: [],
            liaisons: []
        };

        let currentType = null;
        let editingIndex = null;
        let deleteInfo = null;

        // Initialize Office
        Office.onReady((info) => {
            if (info.host === Office.HostType.Excel) {
                loadAllData();
            } else {
                showAlert('Cette application doit etre executee dans Excel.', 'error');
            }
        });

        // Load all data from Excel
        async function loadAllData() {
            try {
                await Excel.run(async (context) => {
                    const sheet = getDataSheet(context);

                    // Load contacts (Column A)
                    const contactsRange = sheet.getRange('A:A').getUsedRange();
                    contactsRange.load('values');

                    // Load projets (Column C)
                    const projetsRange = sheet.getRange('C:C').getUsedRange();
                    projetsRange.load('values');

                    // Load liaisons (Columns E:F)
                    const liaisonsRange = sheet.getRange('E:F').getUsedRange();
                    liaisonsRange.load('values');

                    await context.sync();

                    // Parse contacts (skip header)
                    data.contacts = contactsRange.values
                        .slice(1)
                        .map(row => row[0])
                        .filter(val => val !== null && val !== '');

                    // Parse projets (skip header)
                    data.projets = projetsRange.values
                        .slice(1)
                        .map(row => row[0])
                        .filter(val => val !== null && val !== '');

                    // Parse liaisons (skip header)
                    data.liaisons = liaisonsRange.values
                        .slice(1)
                        .filter(row => row[0] !== null && row[0] !== '' && row[1] !== null && row[1] !== '')
                        .map(row => ({ contact: row[0], projet: row[1] }));

                    updateStats();
                    renderContacts();
                    renderProjets();
                    renderLiaisons();

                    showAlert('Donnees chargees avec succes', 'success');
                });
            } catch (error) {
                console.error(error);
                showAlert('Erreur lors du chargement: ' + error.message, 'error');
            }
        }

        // Update statistics
        function updateStats() {
            document.getElementById('statContacts').textContent = data.contacts.length;
            document.getElementById('statProjets').textContent = data.projets.length;
            document.getElementById('statLiaisons').textContent = data.liaisons.length;
        }

        // Render contacts list
        function renderContacts() {
            const container = document.getElementById('contactsList');
            if (data.contacts.length === 0) {
                container.innerHTML = '<div class="empty-state">Aucun contact</div>';
                return;
            }

            container.innerHTML = data.contacts.map((contact, idx) => `
                <div class="list-item">
                    <div class="list-item-content">
                        <div class="list-item-title">${contact}</div>
                        <div class="list-item-subtitle">${countLiaisons('contact', contact)} projet(s) associe(s)</div>
                    </div>
                    <div class="list-item-actions">
                        <button class="btn btn-warning btn-sm" onclick="editItem('contact', ${idx})">Modifier</button>
                        <button class="btn btn-danger btn-sm" onclick="deleteItem('contact', ${idx})">Suppr.</button>
                    </div>
                </div>
            `).join('');
        }

        // Render projets list
        function renderProjets() {
            const container = document.getElementById('projetsList');
            if (data.projets.length === 0) {
                container.innerHTML = '<div class="empty-state">Aucun projet</div>';
                return;
            }

            container.innerHTML = data.projets.map((projet, idx) => `
                <div class="list-item">
                    <div class="list-item-content">
                        <div class="list-item-title">${projet}</div>
                        <div class="list-item-subtitle">${countLiaisons('projet', projet)} contact(s) associe(s)</div>
                    </div>
                    <div class="list-item-actions">
                        <button class="btn btn-warning btn-sm" onclick="editItem('projet', ${idx})">Modifier</button>
                        <button class="btn btn-danger btn-sm" onclick="deleteItem('projet', ${idx})">Suppr.</button>
                    </div>
                </div>
            `).join('');
        }

        // Render liaisons list
        function renderLiaisons() {
            const container = document.getElementById('liaisonsList');
            if (data.liaisons.length === 0) {
                container.innerHTML = '<div class="empty-state">Aucune liaison</div>';
                return;
            }

            container.innerHTML = data.liaisons.map((liaison, idx) => `
                <div class="list-item">
                    <div class="list-item-content">
                        <div class="list-item-title">
                            <span class="badge badge-contact">${liaison.contact}</span>
                            <span style="margin: 0 8px; color: var(--mh-corail-brand);">&#8596;</span>
                            <span class="badge badge-projet">${liaison.projet}</span>
                        </div>
                    </div>
                    <div class="list-item-actions">
                        <button class="btn btn-warning btn-sm" onclick="editItem('liaison', ${idx})">Modifier</button>
                        <button class="btn btn-danger btn-sm" onclick="deleteItem('liaison', ${idx})">Suppr.</button>
                    </div>
                </div>
            `).join('');
        }

        // Count liaisons for an item
        function countLiaisons(type, value) {
            if (type === 'contact') {
                return data.liaisons.filter(l => l.contact === value).length;
            } else {
                return data.liaisons.filter(l => l.projet === value).length;
            }
        }

        // Show tab
        function showTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

            event.target.classList.add('active');
            document.getElementById('tab-' + tabName).classList.add('active');
        }

        // Open modal
        function openModal(type) {
            currentType = type;
            editingIndex = null;

            const titles = {
                contact: 'Nouveau Contact',
                projet: 'Nouveau Projet',
                liaison: 'Nouvelle Liaison'
            };

            document.getElementById('modalTitle').textContent = titles[type];
            renderFormFields(type, null);
            document.getElementById('modalOverlay').classList.add('active');
        }

        // Edit item
        function editItem(type, index) {
            currentType = type;
            editingIndex = index;

            const titles = {
                contact: 'Modifier Contact',
                projet: 'Modifier Projet',
                liaison: 'Modifier Liaison'
            };

            let value;
            if (type === 'contact') {
                value = data.contacts[index];
            } else if (type === 'projet') {
                value = data.projets[index];
            } else {
                value = data.liaisons[index];
            }

            document.getElementById('modalTitle').textContent = titles[type];
            renderFormFields(type, value);
            document.getElementById('modalOverlay').classList.add('active');
        }

        // Render form fields
        function renderFormFields(type, value) {
            let html = '';

            if (type === 'contact') {
                html = `
                    <div class="form-group">
                        <label>Nom du contact</label>
                        <input type="text" id="fieldName" value="${value || ''}" placeholder="Entrez le nom..." required>
                    </div>
                `;
            } else if (type === 'projet') {
                html = `
                    <div class="form-group">
                        <label>Nom du projet</label>
                        <input type="text" id="fieldName" value="${value || ''}" placeholder="Entrez le nom..." required>
                    </div>
                `;
            } else if (type === 'liaison') {
                const selectedContact = value ? value.contact : '';
                const selectedProjet = value ? value.projet : '';

                html = `
                    <div class="form-group">
                        <label>Contact</label>
                        <select id="fieldContact" required>
                            <option value="">-- Selectionner --</option>
                            ${data.contacts.map(c => `<option value="${c}" ${c === selectedContact ? 'selected' : ''}>${c}</option>`).join('')}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Projet</label>
                        <select id="fieldProjet" required>
                            <option value="">-- Selectionner --</option>
                            ${data.projets.map(p => `<option value="${p}" ${p === selectedProjet ? 'selected' : ''}>${p}</option>`).join('')}
                        </select>
                    </div>
                `;
            }

            document.getElementById('formFields').innerHTML = html;
        }

        // Close modal
        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
            currentType = null;
            editingIndex = null;
        }

        // Save item
        async function saveItem() {
            try {
                if (currentType === 'contact') {
                    const name = document.getElementById('fieldName').value.trim();
                    if (!name) {
                        showAlert('Veuillez entrer un nom', 'error');
                        return;
                    }

                    if (editingIndex !== null) {
                        await updateContact(editingIndex, name);
                    } else {
                        await addContact(name);
                    }
                } else if (currentType === 'projet') {
                    const name = document.getElementById('fieldName').value.trim();
                    if (!name) {
                        showAlert('Veuillez entrer un nom', 'error');
                        return;
                    }

                    if (editingIndex !== null) {
                        await updateProjet(editingIndex, name);
                    } else {
                        await addProjet(name);
                    }
                } else if (currentType === 'liaison') {
                    const contact = document.getElementById('fieldContact').value;
                    const projet = document.getElementById('fieldProjet').value;

                    if (!contact || !projet) {
                        showAlert('Veuillez selectionner un contact et un projet', 'error');
                        return;
                    }

                    if (editingIndex !== null) {
                        await updateLiaison(editingIndex, contact, projet);
                    } else {
                        await addLiaison(contact, projet);
                    }
                }

                closeModal();
                await loadAllData();
            } catch (error) {
                console.error(error);
                showAlert('Erreur: ' + error.message, 'error');
            }
        }

        // Add contact to Excel
        async function addContact(name) {
            await Excel.run(async (context) => {
                const sheet = getDataSheet(context);
                const newRow = data.contacts.length + 2;
                const cell = sheet.getRange(`A${newRow}`);
                cell.values = [[name]];
                await context.sync();
            });
            showAlert('Contact ajoute', 'success');
        }

        // Update contact in Excel
        async function updateContact(index, name) {
            await Excel.run(async (context) => {
                const sheet = getDataSheet(context);
                const row = index + 2;
                const cell = sheet.getRange(`A${row}`);
                cell.values = [[name]];
                await context.sync();
            });
            showAlert('Contact mis a jour', 'success');
        }

        // Add projet to Excel
        async function addProjet(name) {
            await Excel.run(async (context) => {
                const sheet = getDataSheet(context);
                const newRow = data.projets.length + 2;
                const cell = sheet.getRange(`C${newRow}`);
                cell.values = [[name]];
                await context.sync();
            });
            showAlert('Projet ajoute', 'success');
        }

        // Update projet in Excel
        async function updateProjet(index, name) {
            await Excel.run(async (context) => {
                const sheet = getDataSheet(context);
                const row = index + 2;
                const cell = sheet.getRange(`C${row}`);
                cell.values = [[name]];
                await context.sync();
            });
            showAlert('Projet mis a jour', 'success');
        }

        // Add liaison to Excel
        async function addLiaison(contact, projet) {
            await Excel.run(async (context) => {
                const sheet = getDataSheet(context);
                const newRow = data.liaisons.length + 2;
                const range = sheet.getRange(`E${newRow}:F${newRow}`);
                range.values = [[contact, projet]];
                await context.sync();
            });
            showAlert('Liaison ajoutee', 'success');
        }

        // Update liaison in Excel
        async function updateLiaison(index, contact, projet) {
            await Excel.run(async (context) => {
                const sheet = getDataSheet(context);
                const row = index + 2;
                const range = sheet.getRange(`E${row}:F${row}`);
                range.values = [[contact, projet]];
                await context.sync();
            });
            showAlert('Liaison mise a jour', 'success');
        }

        // Delete item
        function deleteItem(type, index) {
            deleteInfo = { type, index };
            document.getElementById('deleteModalOverlay').classList.add('active');
        }

        // Close delete modal
        function closeDeleteModal() {
            document.getElementById('deleteModalOverlay').classList.remove('active');
            deleteInfo = null;
        }

        // Confirm delete
        async function confirmDelete() {
            if (!deleteInfo) return;

            try {
                const { type, index } = deleteInfo;

                await Excel.run(async (context) => {
                    const sheet = getDataSheet(context);
                    const row = index + 2;

                    if (type === 'contact') {
                        const cell = sheet.getRange(`A${row}`);
                        cell.delete(Excel.DeleteShiftDirection.up);
                    } else if (type === 'projet') {
                        const cell = sheet.getRange(`C${row}`);
                        cell.delete(Excel.DeleteShiftDirection.up);
                    } else if (type === 'liaison') {
                        const range = sheet.getRange(`E${row}:F${row}`);
                        range.delete(Excel.DeleteShiftDirection.up);
                    }

                    await context.sync();
                });

                showAlert('Element supprime', 'success');
                closeDeleteModal();
                await loadAllData();
            } catch (error) {
                console.error(error);
                showAlert('Erreur lors de la suppression: ' + error.message, 'error');
            }
        }

        // Show alert
        function showAlert(message, type) {
            const container = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            container.appendChild(alert);

            setTimeout(() => {
                alert.remove();
            }, 3000);
        }

        // Toggle chart visibility
        function toggleChart() {
            const chartContainer = document.getElementById('chartContainer');
            if (chartContainer.style.display === 'none') {
                chartContainer.style.display = 'block';
                renderChart();
            } else {
                chartContainer.style.display = 'none';
            }
        }

        // Render bar chart
        function renderChart() {
            const chartData = [
                { label: 'Contacts', value: data.contacts.length, class: 'bar-contacts' },
                { label: 'Projets', value: data.projets.length, class: 'bar-projets' },
                { label: 'Liaisons', value: data.liaisons.length, class: 'bar-liaisons' }
            ];

            const maxValue = Math.max(...chartData.map(d => d.value), 1);
            const maxHeight = 120;

            const chartHtml = chartData.map(item => {
                const height = (item.value / maxValue) * maxHeight;
                return `
                    <div class="bar-item">
                        <div class="bar ${item.class}" style="height: ${height}px;">
                            <span class="bar-value">${item.value}</span>
                        </div>
                        <span class="bar-label">${item.label}</span>
                    </div>
                `;
            }).join('');

            document.getElementById('barChart').innerHTML = chartHtml;
        }
    </script>
</body>
</html>
