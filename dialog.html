<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion BDD - Application</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>

    <style>
        :root {
            --mh-corail-brand: #E2250C;
            --mh-bleu-dark: #1A283E;
            --mh-violet-dark: #5514C7;
            --mh-bleu-turquoise-dark: #006374;
            --mh-rose-dark: #D81E88;
            --mh-jaune-dark: #F9BD00;
            --mh-vert-dark: #008275;
            --mh-gris-sable-dark: #E4D8C4;
            --mh-corail-light: #F9D3CE;
            --mh-bleu-light: #BDE3F2;
            --mh-violet-light: #AA89E3;
            --mh-vert-light: #03DFB2;
            --mh-corail-pastel: #FFF2F0;
            --mh-bleu-pastel: #E0F1F8;
            --mh-gris-sable-pastel: #F9F7F6;
            --cadrage-surface: #ffffff;
            --cadrage-text: var(--mh-bleu-dark);
            --cadrage-text-secondary: #666666;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 14px;
            background: linear-gradient(135deg, var(--mh-corail-pastel) 0%, var(--mh-gris-sable-pastel) 50%, var(--mh-bleu-pastel) 100%);
            color: var(--cadrage-text);
            min-height: 100vh;
        }

        .app-container { display: flex; flex-direction: column; height: 100vh; }

        header {
            background: var(--mh-corail-brand);
            color: white;
            padding: 15px 25px;
            box-shadow: 0 2px 8px rgba(226, 37, 12, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 { font-size: 20px; font-weight: 600; }
        header p { font-size: 12px; opacity: 0.9; }
        .header-actions { display: flex; gap: 8px; }

        .main-content { flex: 1; padding: 20px; overflow-y: auto; }

        .stats { display: flex; gap: 15px; margin-bottom: 20px; }

        .stat-card {
            flex: 1;
            background: var(--cadrage-surface);
            padding: 20px;
            border-radius: 0.75rem;
            text-align: center;
            border: 1px solid var(--mh-gris-sable-dark);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .stat-card:hover { transform: translateY(-2px); }
        .stat-value { font-size: 28px; font-weight: 700; color: var(--mh-bleu-turquoise-dark); }
        .stat-label { font-size: 13px; color: var(--cadrage-text-secondary); margin-top: 4px; }

        /* Chart */
        .chart-section {
            background: var(--cadrage-surface);
            border-radius: 0.75rem;
            border: 1px solid var(--mh-gris-sable-dark);
            margin-bottom: 20px;
            overflow: hidden;
            display: none;
        }

        .chart-section.active { display: block; }

        .chart-header {
            padding: 12px 20px;
            background: var(--mh-bleu-dark);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chart-header h3 { font-size: 14px; font-weight: 600; }

        .chart-body { padding: 30px; }

        .bar-chart {
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            height: 180px;
        }

        .bar-item { display: flex; flex-direction: column; align-items: center; flex: 1; max-width: 120px; }

        .bar {
            width: 60px;
            border-radius: 8px 8px 0 0;
            transition: height 0.5s ease;
            position: relative;
        }

        .bar-value {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            font-weight: 700;
            font-size: 18px;
            color: var(--mh-bleu-dark);
        }

        .bar-label { margin-top: 12px; font-size: 13px; font-weight: 500; color: var(--cadrage-text-secondary); }

        .bar-contacts { background: linear-gradient(180deg, var(--mh-bleu-light) 0%, var(--mh-bleu-turquoise-dark) 100%); }
        .bar-projets { background: linear-gradient(180deg, var(--mh-vert-light) 0%, var(--mh-vert-dark) 100%); }
        .bar-liaisons { background: linear-gradient(180deg, var(--mh-violet-light) 0%, var(--mh-violet-dark) 100%); }

        .content-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }

        .section {
            background: var(--cadrage-surface);
            border-radius: 0.75rem;
            border: 1px solid var(--mh-gris-sable-dark);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            overflow: hidden;
        }

        .section-header {
            padding: 12px 15px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-header.contacts { background: var(--mh-bleu-turquoise-dark); }
        .section-header.projets { background: var(--mh-vert-dark); }
        .section-header.liaisons { background: var(--mh-violet-dark); }
        .section-header h2 { font-size: 14px; font-weight: 600; }

        .section-body { padding: 12px; max-height: 350px; overflow-y: auto; }

        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: var(--mh-gris-sable-pastel);
            border-radius: 0.4rem;
            margin-bottom: 8px;
        }

        .list-item:hover { background: var(--mh-gris-sable-dark); }
        .list-item:last-child { margin-bottom: 0; }
        .item-name { font-weight: 500; font-size: 13px; }
        .item-meta { font-size: 11px; color: var(--cadrage-text-secondary); }
        .item-actions { display: flex; gap: 6px; }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 7px 14px;
            border: none;
            border-radius: 0.4rem;
            font-family: inherit;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary { background: var(--mh-corail-brand); color: white; }
        .btn-primary:hover { background: #c91f0a; }
        .btn-secondary { background: var(--mh-bleu-dark); color: white; }
        .btn-success { background: var(--mh-vert-dark); color: white; }
        .btn-warning { background: var(--mh-jaune-dark); color: var(--mh-bleu-dark); }
        .btn-danger { background: var(--mh-rose-dark); color: white; }
        .btn-sm { padding: 5px 10px; font-size: 11px; }
        .btn-icon { padding: 5px 8px; }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: white;
            border-radius: 0.75rem;
            padding: 25px;
            min-width: 350px;
            max-width: 450px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .modal h3 { margin-bottom: 20px; color: var(--mh-bleu-dark); }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 500; font-size: 13px; }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--mh-gris-sable-dark);
            border-radius: 0.4rem;
            font-family: inherit;
            font-size: 14px;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--mh-corail-brand);
        }

        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

        .alert-container { position: fixed; top: 20px; right: 20px; z-index: 1001; }

        .alert {
            padding: 12px 20px;
            border-radius: 0.4rem;
            margin-bottom: 10px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .alert-success { background: var(--mh-vert-light); border: 1px solid var(--mh-vert-dark); color: var(--mh-vert-dark); }
        .alert-error { background: var(--mh-corail-light); border: 1px solid var(--mh-corail-brand); color: var(--mh-corail-brand); }

        .loading { display: flex; align-items: center; justify-content: center; padding: 30px; color: var(--cadrage-text-secondary); }

        .spinner {
            width: 20px; height: 20px;
            border: 3px solid var(--mh-gris-sable-dark);
            border-top-color: var(--mh-corail-brand);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .empty-state { text-align: center; padding: 25px; color: var(--cadrage-text-secondary); font-size: 13px; }

        .close-btn { background: transparent; border: none; color: white; font-size: 20px; cursor: pointer; padding: 0 5px; }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <div>
                <h1>Gestion BDD</h1>
                <p>Contacts, Projets & Liaisons</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-warning" onclick="toggleChart()">
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M4 11H2v3h2v-3zm5-4H7v7h2V7zm5-5h-2v12h2V2z"/>
                    </svg>
                    Graphique
                </button>
                <button class="btn btn-secondary" onclick="loadAllData()">
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2v1z"/>
                        <path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466z"/>
                    </svg>
                    Rafraichir
                </button>
                <button class="btn btn-primary" onclick="closeDialog()">Fermer</button>
            </div>
        </header>

        <div class="main-content">
            <div class="stats">
                <div class="stat-card" onclick="toggleChart()">
                    <div class="stat-value" id="statContacts">-</div>
                    <div class="stat-label">Contacts</div>
                </div>
                <div class="stat-card" onclick="toggleChart()">
                    <div class="stat-value" id="statProjets">-</div>
                    <div class="stat-label">Projets</div>
                </div>
                <div class="stat-card" onclick="toggleChart()">
                    <div class="stat-value" id="statLiaisons">-</div>
                    <div class="stat-label">Liaisons</div>
                </div>
            </div>

            <div class="chart-section" id="chartSection">
                <div class="chart-header">
                    <h3>Statistiques</h3>
                    <button class="close-btn" onclick="toggleChart()">&times;</button>
                </div>
                <div class="chart-body">
                    <div class="bar-chart" id="barChart"></div>
                </div>
            </div>

            <div class="content-grid">
                <div class="section">
                    <div class="section-header contacts">
                        <h2>Contacts</h2>
                        <button class="btn btn-sm btn-warning" onclick="showAddModal('contact')">+ Ajouter</button>
                    </div>
                    <div class="section-body" id="contactsList">
                        <div class="loading"><div class="spinner"></div> Chargement...</div>
                    </div>
                </div>

                <div class="section">
                    <div class="section-header projets">
                        <h2>Projets</h2>
                        <button class="btn btn-sm btn-warning" onclick="showAddModal('projet')">+ Ajouter</button>
                    </div>
                    <div class="section-body" id="projetsList">
                        <div class="loading"><div class="spinner"></div> Chargement...</div>
                    </div>
                </div>

                <div class="section">
                    <div class="section-header liaisons">
                        <h2>Liaisons</h2>
                        <button class="btn btn-sm btn-warning" onclick="showAddModal('liaison')">+ Ajouter</button>
                    </div>
                    <div class="section-body" id="liaisonsList">
                        <div class="loading"><div class="spinner"></div> Chargement...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="alert-container" id="alertContainer"></div>

    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h3 id="modalTitle">Ajouter</h3>
            <form id="modalForm" onsubmit="handleFormSubmit(event)">
                <div id="formFields"></div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Annuler</button>
                    <button type="submit" class="btn btn-success">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="deleteModal">
        <div class="modal">
            <h3>Confirmer la suppression</h3>
            <p id="deleteMessage">Voulez-vous vraiment supprimer cet element ?</p>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeDeleteModal()">Annuler</button>
                <button class="btn btn-danger" onclick="confirmDelete()">Supprimer</button>
            </div>
        </div>
    </div>

    <script>
        let data = { contacts: [], projets: [], liaisons: [] };
        let currentModal = { type: null, mode: null, index: null };
        let deleteInfo = null;

        // Initialize Office and set up message handler
        Office.onReady((info) => {
            console.log('Dialog Office.onReady, host:', info.host);

            // Register handler to receive messages from parent
            Office.context.ui.addHandlerAsync(
                Office.EventType.DialogParentMessageReceived,
                onParentMessage,
                (result) => {
                    if (result.status === Office.AsyncResultStatus.Succeeded) {
                        console.log('Handler registered successfully');
                        // Request initial data
                        loadAllData();
                    } else {
                        console.error('Handler registration failed:', result.error);
                    }
                }
            );
        });

        // Handle messages from parent
        function onParentMessage(arg) {
            console.log('Received from parent:', arg.message);
            try {
                const message = JSON.parse(arg.message);
                if (message.action === 'receiveData' && message.data) {
                    data = message.data;
                    updateUI();
                    showAlert('Donnees chargees', 'success');
                }
            } catch (error) {
                console.error('Error parsing parent message:', error);
            }
        }

        function closeDialog() {
            Office.context.ui.messageParent(JSON.stringify({ action: 'close' }));
        }

        function loadAllData() {
            console.log('Requesting data from parent...');
            Office.context.ui.messageParent(JSON.stringify({ action: 'loadData' }));
        }

        function updateUI() {
            document.getElementById('statContacts').textContent = data.contacts.length;
            document.getElementById('statProjets').textContent = data.projets.length;
            document.getElementById('statLiaisons').textContent = data.liaisons.length;

            // Contacts
            const contactsList = document.getElementById('contactsList');
            if (data.contacts.length === 0) {
                contactsList.innerHTML = '<div class="empty-state">Aucun contact</div>';
            } else {
                contactsList.innerHTML = data.contacts.map((c, i) => `
                    <div class="list-item">
                        <div>
                            <div class="item-name">${c}</div>
                            <div class="item-meta">${countLiaisons('contact', c)} projet(s)</div>
                        </div>
                        <div class="item-actions">
                            <button class="btn btn-sm btn-warning btn-icon" onclick="showEditModal('contact', ${i})">&#9998;</button>
                            <button class="btn btn-sm btn-danger btn-icon" onclick="showDeleteModal('contact', ${i})">&#10005;</button>
                        </div>
                    </div>
                `).join('');
            }

            // Projets
            const projetsList = document.getElementById('projetsList');
            if (data.projets.length === 0) {
                projetsList.innerHTML = '<div class="empty-state">Aucun projet</div>';
            } else {
                projetsList.innerHTML = data.projets.map((p, i) => `
                    <div class="list-item">
                        <div>
                            <div class="item-name">${p}</div>
                            <div class="item-meta">${countLiaisons('projet', p)} contact(s)</div>
                        </div>
                        <div class="item-actions">
                            <button class="btn btn-sm btn-warning btn-icon" onclick="showEditModal('projet', ${i})">&#9998;</button>
                            <button class="btn btn-sm btn-danger btn-icon" onclick="showDeleteModal('projet', ${i})">&#10005;</button>
                        </div>
                    </div>
                `).join('');
            }

            // Liaisons
            const liaisonsList = document.getElementById('liaisonsList');
            if (data.liaisons.length === 0) {
                liaisonsList.innerHTML = '<div class="empty-state">Aucune liaison</div>';
            } else {
                liaisonsList.innerHTML = data.liaisons.map((l, i) => `
                    <div class="list-item">
                        <div>
                            <div class="item-name">${l.contact}</div>
                            <div class="item-meta">${l.projet}</div>
                        </div>
                        <div class="item-actions">
                            <button class="btn btn-sm btn-warning btn-icon" onclick="showEditModal('liaison', ${i})">&#9998;</button>
                            <button class="btn btn-sm btn-danger btn-icon" onclick="showDeleteModal('liaison', ${i})">&#10005;</button>
                        </div>
                    </div>
                `).join('');
            }

            // Update chart if visible
            if (document.getElementById('chartSection').classList.contains('active')) {
                renderChart();
            }
        }

        function countLiaisons(type, value) {
            return type === 'contact'
                ? data.liaisons.filter(l => l.contact === value).length
                : data.liaisons.filter(l => l.projet === value).length;
        }

        // Chart functions
        function toggleChart() {
            const section = document.getElementById('chartSection');
            section.classList.toggle('active');
            if (section.classList.contains('active')) {
                renderChart();
            }
        }

        function renderChart() {
            const chartData = [
                { label: 'Contacts', value: data.contacts.length, class: 'bar-contacts' },
                { label: 'Projets', value: data.projets.length, class: 'bar-projets' },
                { label: 'Liaisons', value: data.liaisons.length, class: 'bar-liaisons' }
            ];

            const maxValue = Math.max(...chartData.map(d => d.value), 1);
            const maxHeight = 140;

            document.getElementById('barChart').innerHTML = chartData.map(item => {
                const height = (item.value / maxValue) * maxHeight;
                return `
                    <div class="bar-item">
                        <div class="bar ${item.class}" style="height: ${height}px;">
                            <span class="bar-value">${item.value}</span>
                        </div>
                        <span class="bar-label">${item.label}</span>
                    </div>
                `;
            }).join('');
        }

        // Modal functions
        function showAddModal(type) {
            currentModal = { type, mode: 'add', index: null };
            document.getElementById('modalTitle').textContent = `Ajouter ${type}`;
            renderFormFields(type, null);
            document.getElementById('modal').classList.add('active');
        }

        function showEditModal(type, index) {
            currentModal = { type, mode: 'edit', index };
            document.getElementById('modalTitle').textContent = `Modifier ${type}`;

            let value = null;
            if (type === 'contact') value = data.contacts[index];
            else if (type === 'projet') value = data.projets[index];
            else if (type === 'liaison') value = data.liaisons[index];

            renderFormFields(type, value);
            document.getElementById('modal').classList.add('active');
        }

        function renderFormFields(type, value) {
            const container = document.getElementById('formFields');

            if (type === 'contact' || type === 'projet') {
                container.innerHTML = `
                    <div class="form-group">
                        <label>Nom</label>
                        <input type="text" id="fieldName" value="${value || ''}" required>
                    </div>
                `;
            } else if (type === 'liaison') {
                const contactOptions = data.contacts.map(c =>
                    `<option value="${c}" ${value && value.contact === c ? 'selected' : ''}>${c}</option>`
                ).join('');
                const projetOptions = data.projets.map(p =>
                    `<option value="${p}" ${value && value.projet === p ? 'selected' : ''}>${p}</option>`
                ).join('');

                container.innerHTML = `
                    <div class="form-group">
                        <label>Contact</label>
                        <select id="fieldContact" required>
                            <option value="">Selectionner...</option>
                            ${contactOptions}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Projet</label>
                        <select id="fieldProjet" required>
                            <option value="">Selectionner...</option>
                            ${projetOptions}
                        </select>
                    </div>
                `;
            }
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        function handleFormSubmit(event) {
            event.preventDefault();
            const { type, mode, index } = currentModal;
            let action, payload;

            if (type === 'contact' || type === 'projet') {
                const name = document.getElementById('fieldName').value.trim();
                if (!name) return;
                action = mode === 'add' ? `add${type.charAt(0).toUpperCase() + type.slice(1)}` : `update${type.charAt(0).toUpperCase() + type.slice(1)}`;
                payload = mode === 'add' ? { name } : { index, name };
            } else if (type === 'liaison') {
                const contact = document.getElementById('fieldContact').value;
                const projet = document.getElementById('fieldProjet').value;
                if (!contact || !projet) return;
                action = mode === 'add' ? 'addLiaison' : 'updateLiaison';
                payload = mode === 'add' ? { contact, projet } : { index, contact, projet };
            }

            Office.context.ui.messageParent(JSON.stringify({ action, ...payload }));
            closeModal();
        }

        // Delete functions
        function showDeleteModal(type, index) {
            deleteInfo = { type, index };
            let name = '';
            if (type === 'contact') name = data.contacts[index];
            else if (type === 'projet') name = data.projets[index];
            else if (type === 'liaison') name = `${data.liaisons[index].contact} - ${data.liaisons[index].projet}`;

            document.getElementById('deleteMessage').textContent = `Supprimer "${name}" ?`;
            document.getElementById('deleteModal').classList.add('active');
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.remove('active');
            deleteInfo = null;
        }

        function confirmDelete() {
            if (!deleteInfo) return;
            const action = `delete${deleteInfo.type.charAt(0).toUpperCase() + deleteInfo.type.slice(1)}`;
            Office.context.ui.messageParent(JSON.stringify({ action, index: deleteInfo.index }));
            closeDeleteModal();
        }

        function showAlert(message, type) {
            const container = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            container.appendChild(alert);
            setTimeout(() => alert.remove(), 3000);
        }
    </script>
</body>
</html>
